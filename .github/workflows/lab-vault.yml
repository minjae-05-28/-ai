name: Lab vault

# Keeps obsidian/organelle-evo-lab in step with the results: whenever a law or a result file
# changes on main, the vault is regenerated and committed. A PC that syncs from this folder
# then gets the new nodes without anyone running the builder by hand.
#
# The vault commit only touches obsidian/, which is not in the trigger paths, and pushes made
# with GITHUB_TOKEN do not start workflows, so this cannot loop.

on:
  push:
    branches: [main]
    paths:
      - "laws/**"
      - "results/**"
      - "scripts/build_lab_vault.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lab-vault
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the vault
        run: python scripts/build_lab_vault.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A obsidian/organelle-evo-lab
          if git diff --cached --quiet; then
            echo "Vault unchanged."
            exit 0
          fi
          git commit -m "Lab vault: regenerate from the latest laws and results"
          ok=0
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin main && git push origin HEAD:main && { ok=1; break; }
            git rebase --abort 2>/dev/null || true
            echo "push attempt $i failed; retrying"; sleep $((i*10))
          done
          [ "$ok" = 1 ] || { echo "::error::could not push"; exit 1; }
