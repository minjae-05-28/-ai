name: Mitochondrial ancestor model search

# One round of scripts/mito_model_search.py: every model of the round is evaluated (simulation with
# known truth, whole-order hiding, stability), shards in parallel, then ranked and committed.

on:
  workflow_dispatch:
    inputs:
      round:
        description: "round number"
        default: "1"
      models:
        description: "JSON file with model specs (empty = round-1 enumeration)"
        default: ""
      n_shards:
        default: "10"

permissions:
  contents: write

concurrency:
  group: mito-models-${{ inputs.round }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.s.outputs.shards }}
    steps:
      - id: s
        run: echo "shards=$(python3 -c "import json;print(json.dumps(list(range(int('${{ inputs.n_shards }}')))))")" >> "$GITHUB_OUTPUT"

  evaluate:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy
      - name: Evaluate shard ${{ matrix.shard }}
        env:
          PYTHONPATH: src
        run: |
          extra=""
          if [ -n "${{ inputs.models }}" ]; then extra="--models ${{ inputs.models }}"; fi
          python scripts/mito_model_search.py --round ${{ inputs.round }} --shard ${{ matrix.shard }} \
            --n-shards ${{ inputs.n_shards }} $extra
      - uses: actions/upload-artifact@v4
        with:
          name: mito-round${{ inputs.round }}-${{ matrix.shard }}
          path: results/mito_models/round${{ inputs.round }}/

  collect:
    needs: evaluate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy
      - uses: actions/download-artifact@v4
        with:
          pattern: mito-round${{ inputs.round }}-*
          path: results/mito_models/round${{ inputs.round }}
          merge-multiple: true
      - name: Rank
        env:
          PYTHONPATH: src
        run: python scripts/mito_model_search.py --round ${{ inputs.round }} --rank
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/mito_models
          if git diff --cached --quiet; then echo "Nothing new."; else
            git commit -m "Mitochondrial ancestor model search: round ${{ inputs.round }}"
            ok=0
            for i in 1 2 3 4 5 6; do
              git pull --rebase origin main && git push origin HEAD:main && { ok=1; break; }
              echo "push attempt $i failed; retrying"; sleep $((i*10))
            done
            [ "$ok" = 1 ] || { echo "::error::could not push"; exit 1; }
          fi
