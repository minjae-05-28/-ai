name: Ribosomal tree

# Ribosomal-protein markers per species, then one concatenated FastTree phylogeny per
# analysis set (prokaryotes, eukaryotes, insect symbionts). Commits data/markers and
# results/phylo_tree.

on:
  # Manual only: a push-triggered run rebuilt every set (and replaced the 151-species eukaryote tree
  # existing laws use) after an unrelated edit to scripts/ribosomal_tree.py.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ribosomal-tree
  cancel-in-progress: false

env:
  PFAM_URL: https://ftp.ebi.ac.uk/pub/databases/Pfam/current_release/Pfam-A.hmm.gz
  PFAM_KEY: pfam-a-current-v1

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      entries: ${{ steps.list.outputs.entries }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy
      - id: list
        env:
          PYTHONPATH: src
        run: echo "entries=$(python scripts/ribosomal_tree.py --list-missing)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: pfam
          key: ${{ env.PFAM_KEY }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: mkdir -p pfam && curl -fsSL "$PFAM_URL" -o pfam/Pfam-A.hmm.gz

  markers:
    needs: plan
    if: needs.plan.outputs.entries != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        entry: ${{ fromJSON(needs.plan.outputs.entries) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyhmmer numpy biopython
      - uses: actions/cache/restore@v4
        with:
          path: pfam
          key: ${{ env.PFAM_KEY }}
          fail-on-cache-miss: true
      - run: gunzip -kf pfam/Pfam-A.hmm.gz
      - name: Markers of ${{ matrix.entry }}
        env:
          PYTHONPATH: src
        run: python scripts/ribosomal_tree.py --entry "${{ matrix.entry }}" --pfam pfam/Pfam-A.hmm
      - uses: actions/upload-artifact@v4
        with:
          name: markers-${{ strategy.job-index }}
          path: data/markers

  build:
    needs: [plan, markers]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy && sudo apt-get update -q && sudo apt-get install -y -q mafft fasttree
      - uses: actions/download-artifact@v4
        with:
          pattern: markers-*
          path: data/markers
          merge-multiple: true
      - name: Build trees
        env:
          PYTHONPATH: src
        run: python scripts/ribosomal_tree.py --build --bootstrap 20
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/markers results/phylo_tree
          if git diff --cached --quiet; then echo "Nothing new."; else
            git commit -m "Ribosomal-protein phylogenies"
            ok=0
            for i in 1 2 3 4 5 6; do
              git pull --rebase origin main && git push origin HEAD:main && { ok=1; break; }
              echo "push attempt $i failed; retrying"; sleep $((i*10))
            done
            [ "$ok" = 1 ] || { echo "::error::could not push collected data after 6 attempts"; exit 1; }
          fi
