name: Fetch real genomes from NCBI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fetch-data.yml"
      - "src/organelle_evo/realdata/catalog.py"
      - "src/organelle_evo/realdata/ncbi.py"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download GenBank records (cached files are kept)
        env:
          PYTHONPATH: src
        run: python scripts/fetch_data.py
      - name: Commit downloaded data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/raw
          if git diff --cached --quiet; then
            echo "No new data."
          else
            git commit -m "Add real genomes fetched from NCBI"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
