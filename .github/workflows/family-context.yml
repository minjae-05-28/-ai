name: Family context

# Context features per Pfam family (codon-usage expression proxy, domain partners, operons,
# exons) for every bacterium/archaeon and free-living eukaryote. Committed to
# data/family_context/<catalog>/.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/family-context.yml"
      - "scripts/family_context.py"
      - "src/organelle_evo/context.py"

permissions:
  contents: write

concurrency:
  group: family-context
  cancel-in-progress: false

env:
  PFAM_URL: https://ftp.ebi.ac.uk/pub/databases/Pfam/current_release/Pfam-A.hmm.gz
  PFAM_KEY: pfam-a-current-v1

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      entries: ${{ steps.list.outputs.entries }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy
      - id: list
        env:
          PYTHONPATH: src
        run: echo "entries=$(python scripts/family_context.py --list-missing)" >> "$GITHUB_OUTPUT"
      - name: Download Pfam once and cache it
        uses: actions/cache@v4
        id: cache
        with:
          path: pfam
          key: ${{ env.PFAM_KEY }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: mkdir -p pfam && curl -fsSL "$PFAM_URL" -o pfam/Pfam-A.hmm.gz && ls -lh pfam

  profile:
    needs: plan
    if: needs.plan.outputs.entries != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        entry: ${{ fromJSON(needs.plan.outputs.entries) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyhmmer numpy biopython
      - uses: actions/cache/restore@v4
        with:
          path: pfam
          key: ${{ env.PFAM_KEY }}
          fail-on-cache-miss: true
      - run: gunzip -kf pfam/Pfam-A.hmm.gz
      - name: Context of ${{ matrix.entry }}
        env:
          PYTHONPATH: src
        run: |
          subset=""
          case "${{ matrix.entry }}" in eukaryotes/*) subset="--families data/eukaryotes/pfam_subset.txt";; esac
          python scripts/family_context.py --entry "${{ matrix.entry }}" --pfam pfam/Pfam-A.hmm $subset
      - uses: actions/upload-artifact@v4
        with:
          name: context-${{ strategy.job-index }}
          path: data/family_context

  collect:
    needs: [plan, profile]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: context-*
          path: data/family_context
          merge-multiple: true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/family_context
          if git diff --cached --quiet; then
            echo "No new context files."
          else
            git commit -m "Add family context features"
            ok=0
            for i in 1 2 3 4 5 6; do
              git pull --rebase origin main && git push origin HEAD:main && { ok=1; break; }
              echo "push attempt $i failed; retrying"; sleep $((i*10))
            done
            [ "$ok" = 1 ] || { echo "::error::could not push collected data after 6 attempts"; exit 1; }
          fi
