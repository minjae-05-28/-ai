name: Prokaryote family composition

# Amino-acid composition of every Pfam family's domains, per bacterium or archaeon, for
# family-level sequence laws. Committed to data/family_composition/prokaryotes/.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/family-composition.yml"
      - "scripts/family_composition.py"

permissions:
  contents: write

concurrency:
  group: family-composition
  cancel-in-progress: false

env:
  PFAM_URL: https://ftp.ebi.ac.uk/pub/databases/Pfam/current_release/Pfam-A.hmm.gz
  PFAM_KEY: pfam-a-current-v1

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      species: ${{ steps.list.outputs.species }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - id: list
        env:
          PYTHONPATH: src
        run: echo "species=$(python scripts/family_composition.py --list-missing)" >> "$GITHUB_OUTPUT"
      - name: Download Pfam once and cache it
        uses: actions/cache@v4
        id: cache
        with:
          path: pfam
          key: ${{ env.PFAM_KEY }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: mkdir -p pfam && curl -fsSL "$PFAM_URL" -o pfam/Pfam-A.hmm.gz && ls -lh pfam

  profile:
    needs: plan
    if: needs.plan.outputs.species != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        species: ${{ fromJSON(needs.plan.outputs.species) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyhmmer numpy biopython
      - uses: actions/cache/restore@v4
        with:
          path: pfam
          key: ${{ env.PFAM_KEY }}
          fail-on-cache-miss: true
      - run: gunzip -kf pfam/Pfam-A.hmm.gz
      - name: Profile ${{ matrix.species }}
        env:
          PYTHONPATH: src
        run: |
          python scripts/family_composition.py --species "${{ matrix.species }}" --pfam pfam/Pfam-A.hmm
      - uses: actions/upload-artifact@v4
        with:
          name: profile-${{ strategy.job-index }}
          path: data/family_composition/prokaryotes/*.json

  collect:
    needs: [plan, profile]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyhmmer numpy biopython
      - uses: actions/download-artifact@v4
        with:
          pattern: profile-*
          path: data/family_composition/prokaryotes
          merge-multiple: true
      - uses: actions/cache/restore@v4
        with:
          path: pfam
          key: ${{ env.PFAM_KEY }}
      - name: Commit profiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/family_composition
          if git diff --cached --quiet; then
            echo "No new profiles."
          else
            git commit -m "Add prokaryote family composition"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
