name: PRISM drug response

# PRISM drug response summaries for pre-registration 23 (deviation 1). Commits data/drug/.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prism.yml"
      - "scripts/prism_fetch.py"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download
        run: |
          pip install numpy
          python scripts/prism_fetch.py
      - name: Commit downloaded data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/drug
          if git diff --cached --quiet; then
            echo "No new data."
          else
            git commit -m "Add PRISM drug response summaries"
            ok=0
            for i in 1 2 3 4 5 6; do
              git pull --rebase origin main && git push origin HEAD:main && { ok=1; break; }
              echo "push attempt $i failed; retrying"; sleep $((i*10))
            done
            [ "$ok" = 1 ] || { echo "::error::could not push"; exit 1; }
          fi
