name: Markers and tree for a UniProt-collected clade

# Ribosomal markers from UniProt proteomes (scripts/uniprot_markers.py), then one concatenated
# FastTree phylogeny for that set only, so the existing trees in results/phylo_tree are untouched.

on:
  workflow_dispatch:
    inputs:
      group:
        description: "comma-separated uniprot_proteomes.GROUPS keys, e.g. amoebozoa,discoba"
        default: ""
      upids_file:
        description: "optional committed sample file, e.g. data/markers/leca_pick.json (from pick_eukaryotes.py)"
        default: ""
      pick:
        description: "optional kingdom:N, a lineage-spread sample of that kingdom (pick_clade_sample.py), e.g. fungi:300"
        default: ""
      set:
        description: "marker set name, e.g. amoeba"
        required: true
      n_shards:
        default: "6"
      bootstrap:
        description: "bootstrap replicate trees"
        default: "20"
      method:
        description: "fasttree, iqtree (LG+F+G4 under the eukaryote supergroup constraint; needs lineage), or iqtree-fast"
        default: "fasttree"
      lineage:
        description: "pick file with NCBI lineages, for the iqtree constraint (e.g. data/markers/leca2_pick.json)"
        default: ""

permissions:
  contents: write

concurrency:
  group: marker-tree-${{ inputs.set }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.s.outputs.shards }}
    steps:
      - id: s
        run: echo "shards=$(python3 -c "import json;print(json.dumps(list(range(int('${{ inputs.n_shards }}')))))")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: inputs.pick != ''
      - uses: actions/setup-python@v5
        if: inputs.pick != ''
        with:
          python-version: "3.11"
      - name: Lineage-spread sample
        if: inputs.pick != ''
        env:
          PYTHONPATH: src
        run: |
          pip install numpy
          k="${{ inputs.pick }}"
          python scripts/pick_clade_sample.py --kingdom "${k%%:*}" --n "${k##*:}" --set "${{ inputs.set }}"
      - uses: actions/upload-artifact@v4
        if: inputs.pick != ''
        with:
          name: pick-${{ inputs.set }}
          path: data/markers/${{ inputs.set }}_pick.json

  markers:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy
      - uses: actions/download-artifact@v4
        if: inputs.pick != ''
        with:
          name: pick-${{ inputs.set }}
          path: data/markers
      - name: Markers shard ${{ matrix.shard }}
        env:
          PYTHONPATH: src
        run: |
          extra=""
          [ -n "${{ inputs.pick }}" ] && extra="--upids data/markers/${{ inputs.set }}_pick.json"
          [ -n "${{ inputs.upids_file }}" ] && extra="--upids ${{ inputs.upids_file }}"
          python scripts/uniprot_markers.py --group "${{ inputs.group }}" --set "${{ inputs.set }}" $extra \
            --shard ${{ matrix.shard }} --n-shards ${{ strategy.job-total }}
      - uses: actions/upload-artifact@v4
        with:
          name: markers-${{ inputs.set }}-${{ matrix.shard }}
          path: data/markers/${{ inputs.set }}/

  tree:
    needs: markers
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy && sudo apt-get update -q && sudo apt-get install -y -q mafft fasttree iqtree
      - uses: actions/download-artifact@v4
        with:
          pattern: markers-${{ inputs.set }}-*
          path: data/markers/${{ inputs.set }}
          merge-multiple: true
      - uses: actions/download-artifact@v4
        if: inputs.pick != ''
        with:
          name: pick-${{ inputs.set }}
          path: data/markers
      - name: Build the tree for this set only
        env:
          PYTHONPATH: src
        # Capped below the job limit: the tree and every finished bootstrap are written as they come,
        # so a slow bootstrap costs replicates, not the whole run.
        run: |
          extra=""
          [ "${{ inputs.method }}" = "iqtree" ] && extra="--method iqtree --lineage ${{ inputs.lineage }}"
          [ "${{ inputs.method }}" = "iqtree-fast" ] && extra="--method iqtree --fast --lineage ${{ inputs.lineage }}"
          timeout 230m python scripts/ribosomal_tree.py --build --only "${{ inputs.set }}" --bootstrap ${{ inputs.bootstrap }} $extra \
            || { [ -f results/phylo_tree/${{ inputs.set }}.nwk ] && echo "::warning::stopped early; keeping the tree and $(wc -l < results/phylo_tree/${{ inputs.set }}.boot.nwk 2>/dev/null || echo 0) bootstrap trees"; }
      - uses: actions/upload-artifact@v4
        with:
          name: tree-${{ inputs.set }}
          path: |
            results/phylo_tree/${{ inputs.set }}.nwk
            results/phylo_tree/${{ inputs.set }}.boot.nwk
            results/phylo_tree/${{ inputs.set }}.json
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/markers/${{ inputs.set }} results/phylo_tree
          [ -f data/markers/${{ inputs.set }}_pick.json ] && git add -f data/markers/${{ inputs.set }}_pick.json
          if git diff --cached --quiet; then echo "Nothing new."; else
            git commit -m "Markers and tree for ${{ inputs.set }}"
            ok=0
            for i in 1 2 3 4 5 6; do
              git pull --rebase origin main && git push origin HEAD:main && { ok=1; break; }
              git rebase --abort 2>/dev/null || true
              echo "push attempt $i failed; retrying"; sleep $((i*10))
            done
            [ "$ok" = 1 ] || { echo "::error::could not push"; exit 1; }
          fi
