name: Recover artifacts

# Commit the data artifacts of an earlier run whose own commit step did not go through.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run id whose artifacts to recover"
        required: true
      pattern:
        description: "Artifact name pattern, e.g. phenotypes-*"
        required: true
      path:
        description: "Where the artifacts go in the repo, e.g. data/phenotypes"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: ${{ inputs.pattern }}
          path: ${{ inputs.path }}
          merge-multiple: true
      - name: Commit
        env:
          DEST: ${{ inputs.path }}
          RUN: ${{ inputs.run_id }}
        run: |
          find "$DEST" -type f | head -50
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$DEST"
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -m "Recover data from run $RUN"
          ok=0
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin main && git push origin HEAD:main && { ok=1; break; }
            echo "push attempt $i failed; retrying"; sleep $((i*10))
          done
          [ "$ok" = 1 ] || { echo "::error::could not push recovered data"; exit 1; }
