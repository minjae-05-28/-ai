[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "organelle-evo"
version = "0.1.0"
description = "Learning the laws of endosymbiont-to-mitochondrion evolution with simulation-based AI"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.0", "matplotlib>=3.7", "biopython>=1.80"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
